<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1a13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golf Strong">
<title>Golf Strength Program · Sundberg 5-Week</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f1a13'/%3E%3Ccircle cx='90' cy='74' r='30' fill='none' stroke='%2352a36e' stroke-width='6'/%3E%3Cline x1='90' y1='104' x2='90' y2='150' stroke='%2352a36e' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M90 150 L130 138 L90 126 Z' fill='%23d4a336'/%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0f1a13; --bg2:#0d1f12; --line:#1e3a26; --line2:#2d5a3a;
    --txt:#e8f0e8; --txt2:#c0d8c4; --muted:#7aab8a; --muted2:#5a8a6a;
    --green:#2d6a4f; --green-a:#52a36e; --gold:#d4a336;
    --d1:#2d6a4f; --d1a:#52a36e; --d2:#1a4971; --d2a:#5a9fd4; --d3:#6b3a1f; --d3a:#d4905a;
    --serif:'Georgia','Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  html,body{background:var(--bg);color:var(--txt);font-family:var(--sans);overscroll-behavior-y:none}
  body{min-height:100vh;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
  #app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
  h1,h2,h3,.serif{font-family:var(--serif)}
  button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
  input{font-family:inherit}
  a{color:inherit}
  .hidden{display:none!important}

  /* top safe area */
  .safetop{padding-top:env(safe-area-inset-top)}

  /* ===== Header ===== */
  .hero{background:linear-gradient(135deg,#1a3a22 0%,#0f1a13 100%);border-bottom:1px solid var(--line2);padding:calc(22px + env(safe-area-inset-top)) 20px 16px;text-align:center}
  .hero .kicker{font-size:10px;letter-spacing:3px;color:var(--green-a);text-transform:uppercase;margin-bottom:6px}
  .hero h1{font-size:23px;color:#d4edda;margin-bottom:3px}
  .hero .sub{font-size:12px;color:var(--muted)}

  /* week selector */
  .weekbar{display:flex;gap:6px;padding:12px 14px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .weekbar::-webkit-scrollbar{display:none}
  .weekpill{flex:0 0 auto;background:rgba(255,255,255,0.04);border:1px solid var(--line2);border-radius:20px;padding:8px 14px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;transition:all .15s}
  .weekpill .wl{font-size:9px;letter-spacing:1px;text-transform:uppercase;opacity:.7;display:block}
  .weekpill.active{background:var(--green);border-color:var(--green-a);color:#fff}
  .weekpill.deload.active{background:#6b3a1f;border-color:#d4905a}

  /* stats strip */
  .stats{display:flex;gap:8px;padding:8px 14px 4px}
  .stat{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center}
  .stat .v{font-size:19px;font-weight:800;color:#d4edda;font-family:var(--serif)}
  .stat .v small{font-size:11px;color:var(--muted)}
  .stat .l{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .stat.fire .v{color:var(--gold)}

  /* day cards */
  .days{padding:12px 14px 90px;display:flex;flex-direction:column;gap:12px}
  .daycard{border-radius:14px;padding:14px;text-align:left;position:relative;overflow:hidden;transition:transform .1s}
  .daycard:active{transform:scale(.985)}
  .daycard .badge{display:inline-block;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;margin-bottom:8px}
  .daycard .dtitle{font-size:19px;font-weight:700;color:#d4edda;font-family:var(--serif)}
  .daycard .dmeta{font-size:11px;color:var(--muted);margin-top:2px}
  .daycard .svgstrip{display:flex;gap:6px;margin:10px 0 4px}
  .daycard .svgstrip .cell{width:42px;height:42px;background:var(--bg2);border-radius:7px;border:1px solid var(--line);overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .daycard .ring{position:absolute;top:12px;right:12px;width:46px;height:46px}
  .daycard .open{margin-top:12px;color:#fff;text-align:center;padding:9px;border-radius:8px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
  .donechk{position:absolute;top:14px;right:14px;background:var(--green-a);color:#06210f;font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px;display:flex;align-items:center;gap:4px}

  /* generic screen */
  .screen{min-height:100vh;min-height:100dvh}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(11px + env(safe-area-inset-top)) 14px 11px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--bg);z-index:20}
  .backbtn{color:var(--green-a);font-size:13px;font-weight:600;padding:4px 2px;display:flex;align-items:center;gap:5px}
  .navbtns{display:flex;gap:8px}
  .navbtns .nb{font-size:12px;padding:6px 12px;border-radius:7px;font-weight:600;border:1px solid var(--line2);background:rgba(255,255,255,0.05);color:var(--txt2)}
  .navbtns .nb.primary{background:var(--green-a);border-color:transparent;color:#06210f;font-weight:800}
  .navbtns .nb:disabled{opacity:.3}

  /* day view */
  .dayhead{padding:13px 16px 11px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--bg);z-index:20}
  .dayhead .row{display:flex;align-items:center;gap:10px;margin-top:7px}
  .startbtn{margin:14px 16px 2px;display:block;width:calc(100% - 32px);color:#fff;font-size:14px;font-weight:800;padding:14px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
  .progresswrap{margin:10px 16px 0;height:7px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden}
  .progressbar{height:100%;width:0;border-radius:4px;transition:width .3s}
  .section{padding:14px 16px 0}
  .section .stitle{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800}
  .section .ssub{font-size:11px;color:var(--muted2);margin-top:2px}
  .exrow{display:flex;align-items:stretch;overflow:hidden;border-radius:10px;border:1px solid var(--line2);margin-top:8px;background:rgba(255,255,255,0.035);transition:transform .1s,opacity .2s}
  .exrow:active{transform:scale(.99)}
  .exrow.done{opacity:.55}
  .exrow .thumb{width:64px;flex:0 0 auto;background:var(--bg2);display:flex;align-items:center;justify-content:center;padding:6px}
  .exrow .thumb .cell{width:52px;height:52px}
  .exrow .body{flex:1;padding:9px 8px 9px 11px;min-width:0}
  .exrow .nm{font-size:14px;color:#d4edda;font-weight:600}
  .exrow .nt{font-size:11px;margin-top:2px;font-weight:600}
  .exrow .rp{font-size:12px;color:var(--muted);margin-top:2px}
  .exrow .right{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 11px;flex:0 0 auto;gap:5px}
  .exrow .chev{font-size:18px}
  .exrow .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}
  .exrow.done .tick{border-color:var(--green-a);background:var(--green-a);color:#06210f}

  /* exercise detail */
  .exhead-illus{background:var(--bg2);border-bottom:1px solid var(--line);display:flex;justify-content:center;align-items:center;height:184px;padding:10px 20px}
  .exhead-illus .frame{height:168px;width:auto;max-width:290px}
  .exbody{padding:14px 18px 120px}
  .tag{font-size:10px;background:rgba(82,163,110,0.2);color:var(--green-a);padding:3px 10px;border-radius:10px;display:inline-block;margin-bottom:8px;font-weight:700}
  .exbody h2{font-size:21px;color:#d4edda;margin-bottom:4px}
  .muscles{font-size:12px;color:var(--muted);margin-bottom:14px}
  .card{border-radius:11px;padding:12px 13px;margin-bottom:13px}
  .card .clabel{font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;font-weight:700}
  .card.benefit{background:rgba(212,163,54,0.07);border:1px solid rgba(212,163,54,0.22)}
  .card.benefit .clabel{color:var(--gold)}
  .card.benefit .ctext{font-size:13px;color:#e8d9a8;line-height:1.6}
  .card.prog{background:rgba(45,106,79,0.15);border:1px solid var(--green)}
  .card.prog .clabel{color:var(--green-a)}
  .progrow{display:flex;gap:10px;margin-bottom:7px;align-items:flex-start}
  .progrow.cur{background:rgba(82,163,110,.12);margin:0 -6px 7px;padding:5px 6px;border-radius:7px}
  .progrow .wk{width:46px;font-size:10px;font-weight:800;text-transform:uppercase;padding-top:2px;flex:0 0 auto}
  .progrow .pd{font-size:13px;color:var(--txt2);line-height:1.5}
  .progrow .nowtag{font-size:8px;background:var(--green-a);color:#06210f;padding:1px 5px;border-radius:8px;margin-left:6px;vertical-align:middle}
  .steps .clabel{color:var(--green-a)}
  .step{display:flex;gap:10px;margin-bottom:9px;align-items:flex-start}
  .step .n{width:22px;height:22px;border-radius:50%;background:var(--green);color:#d4edda;font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:700}
  .step .t{font-size:13px;color:var(--txt2);line-height:1.6;padding-top:2px}
  .cue{background:rgba(82,163,110,0.1);border-left:3px solid var(--green-a);border-radius:0 9px 9px 0;padding:11px 13px;margin-bottom:13px}
  .cue .clabel{color:var(--green-a)}
  .cue .ct{font-size:14px;color:#d4edda;font-style:italic;font-family:var(--serif)}
  .videolink{display:flex;align-items:center;gap:10px;background:rgba(255,0,0,0.08);border:1px solid rgba(255,80,80,0.25);border-radius:11px;padding:12px 14px;text-decoration:none;margin-bottom:18px}
  .videolink .yt{background:#ff0000;color:#fff;font-size:11px;padding:4px 8px;border-radius:4px;font-weight:800;flex:0 0 auto}
  .videolink .vl{font-size:13px;color:#ffb3b0;line-height:1.4}

  /* logger */
  .logger{border:1px solid var(--line2);border-radius:12px;padding:13px;margin-bottom:14px;background:rgba(255,255,255,0.025)}
  .logger .lhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .logger .lhead .lt{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800}
  .logger .target{font-size:12px;color:var(--muted);margin-bottom:10px}
  .lastweek{font-size:11px;color:var(--muted2);margin-bottom:10px}
  .lastweek b{color:var(--green-a)}
  .setrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .setrow .sidx{width:20px;font-size:12px;color:var(--muted);font-weight:700;flex:0 0 auto;text-align:center}
  .setrow .fld{flex:1;display:flex;flex-direction:column;gap:2px}
  .setrow .fld label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2)}
  .setrow input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:9px 8px;color:var(--txt);font-size:15px;text-align:center}
  .setrow input:focus{outline:none;border-color:var(--green-a)}
  .setrow .setdone{width:38px;height:38px;border-radius:9px;border:2px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);margin-top:13px}
  .setrow .setdone.on{background:var(--green-a);border-color:var(--green-a);color:#06210f}
  .setrow.pb .sidx::after{content:'★';color:var(--gold);display:block;font-size:10px}
  .loggeractions{display:flex;gap:8px;margin-top:4px}
  .miniact{flex:1;font-size:12px;font-weight:700;padding:9px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,0.05);color:var(--txt2);text-align:center}
  .miniact.add{color:var(--green-a)}

  /* rep counter */
  .counter{display:flex;flex-direction:column;align-items:center;margin:6px 0 4px}
  .tapbtn{width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#2d6a4f,#143524);border:3px solid var(--green-a);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(0,0,0,.4);transition:transform .07s}
  .tapbtn:active{transform:scale(.93)}
  .tapbtn .cnum{font-size:46px;font-weight:800;color:#d4edda;font-family:var(--serif);line-height:1}
  .tapbtn .clbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--green-a);margin-top:4px}
  .counterctrls{display:flex;gap:10px;margin-top:12px;align-items:center}
  .counterctrls button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,0.05);font-size:20px;color:var(--txt2);display:flex;align-items:center;justify-content:center}
  .counterctrls .log{width:auto;padding:0 18px;color:var(--green-a);font-weight:800;font-size:13px}

  /* timer */
  .timerwrap{display:flex;flex-direction:column;align-items:center;margin:4px 0}
  .timedisplay{font-size:54px;font-weight:800;font-family:var(--serif);color:#d4edda;letter-spacing:1px}
  .timedisplay.warn{color:var(--gold)}
  .timedisplay.go{color:var(--green-a)}
  .timerctrls{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
  .timerctrls button{padding:10px 18px;border-radius:10px;font-weight:800;font-size:13px;border:1px solid var(--line2);background:rgba(255,255,255,0.05);color:var(--txt2)}
  .timerctrls button.go{background:var(--green-a);color:#06210f;border-color:transparent}
  .segtabs{display:flex;gap:6px;margin-bottom:12px;background:var(--bg2);padding:4px;border-radius:11px}
  .segtabs button{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted)}
  .segtabs button.on{background:var(--green);color:#fff}

  /* rest timer floating */
  #resttimer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 28px));background:#10271a;border:1px solid var(--green);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #resttimer .rt-num{font-size:30px;font-weight:800;font-family:var(--serif);color:var(--green-a);min-width:62px;text-align:center}
  #resttimer .rt-mid{flex:1}
  #resttimer .rt-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  #resttimer .rt-bar{height:5px;background:rgba(255,255,255,0.08);border-radius:3px;margin-top:5px;overflow:hidden}
  #resttimer .rt-fill{height:100%;background:var(--green-a);width:100%}
  #resttimer .rt-btns{display:flex;gap:6px}
  #resttimer .rt-btns button{padding:7px 10px;border-radius:8px;font-size:12px;font-weight:700;background:rgba(255,255,255,0.07);color:var(--txt2);border:1px solid var(--line2)}

  /* exercise chip rail */
  .chiprail{display:flex;gap:7px;padding:11px 16px;overflow-x:auto;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
  .chiprail::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-size:12px;padding:7px 12px;border-radius:20px;border:1px solid var(--line2);background:rgba(255,255,255,0.04);color:var(--muted);font-weight:600;white-space:nowrap}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green-a)}
  .chip.done::before{content:'✓ ';color:var(--green-a)}
  .chip.on.done::before{color:#bfe9cc}

  /* guided */
  .guided-top{display:flex;align-items:center;gap:10px;padding:calc(11px + env(safe-area-inset-top)) 14px 8px}
  .guided-top .gx{font-size:13px;color:var(--green-a);font-weight:700}
  .gcount{font-size:12px;color:var(--muted)}
  .gsec{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800;text-align:center;margin-top:4px}
  .gname{font-size:25px;text-align:center;color:#d4edda;font-family:var(--serif);margin:2px 16px 4px}
  .gtarget{text-align:center;font-size:14px;color:var(--gold);font-weight:700;margin-bottom:6px}
  .gillus{height:150px;display:flex;align-items:center;justify-content:center;margin:6px 0}
  .gillus .frame{height:140px;max-width:240px}
  .gnav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 24%);z-index:40}
  .gnav button{flex:1;padding:15px;border-radius:12px;font-weight:800;font-size:15px;border:1px solid var(--line2);background:rgba(255,255,255,0.05);color:var(--txt2)}
  .gnav button.primary{flex:2;background:var(--green-a);color:#06210f;border-color:transparent}
  .gnav button.finish{background:var(--gold);color:#241a00}

  /* bottom nav */
  .tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;display:flex;background:rgba(13,25,16,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted2);font-size:10px;font-weight:600}
  .tabbar button.on{color:var(--green-a)}
  .tabbar button .ic{font-size:19px;line-height:1}

  /* history / settings */
  .pad{padding:14px 16px 110px}
  .h2row{font-size:20px;color:#d4edda;font-family:var(--serif);margin-bottom:4px}
  .sub2{font-size:12px;color:var(--muted);margin-bottom:14px}
  .histcard{border:1px solid var(--line2);border-radius:11px;padding:12px;margin-bottom:10px}
  .histcard .ht{display:flex;justify-content:space-between;align-items:center}
  .histcard .hname{font-size:15px;color:#d4edda;font-weight:700}
  .histcard .hdate{font-size:11px;color:var(--muted)}
  .histcard .hmeta{font-size:12px;color:var(--muted);margin-top:6px}
  .setbtn{width:100%;text-align:left;border:1px solid var(--line2);border-radius:11px;padding:13px 14px;margin-bottom:10px;background:rgba(255,255,255,0.03);font-size:14px;color:var(--txt2);display:flex;justify-content:space-between;align-items:center}
  .setbtn .sv{font-size:12px;color:var(--muted)}
  .toggle{width:46px;height:27px;border-radius:14px;background:var(--line2);position:relative;flex:0 0 auto;transition:background .2s}
  .toggle.on{background:var(--green-a)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .2s}
  .toggle.on .knob{left:22px}
  .empty{text-align:center;color:var(--muted2);font-size:13px;padding:40px 20px;line-height:1.7}

  /* confetti + toast */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
  #celebrate{position:fixed;inset:0;z-index:81;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,16,10,.82);text-align:center;padding:30px}
  #celebrate .big{font-size:60px;margin-bottom:10px}
  #celebrate h2{font-size:28px;color:#d4edda;margin-bottom:8px}
  #celebrate p{font-size:14px;color:var(--txt2);line-height:1.6;max-width:300px;margin-bottom:8px}
  #celebrate .cstats{display:flex;gap:14px;margin:14px 0 22px}
  #celebrate .cstat .v{font-size:26px;font-weight:800;color:var(--gold);font-family:var(--serif)}
  #celebrate .cstat .l{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  #celebrate button{background:var(--green-a);color:#06210f;font-weight:800;padding:14px 36px;border-radius:30px;font-size:15px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:#143524;border:1px solid var(--green-a);color:#d4edda;font-size:13px;font-weight:600;padding:10px 18px;border-radius:24px;z-index:70;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

  /* install hint */
  #installhint{margin:0 14px 16px;background:rgba(82,163,110,0.08);border:1px solid var(--green);border-left:3px solid var(--green-a);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--txt2);line-height:1.55}
  #installhint b{color:var(--green-a)}
  #installhint .x{float:right;color:var(--muted);font-size:16px;padding:0 0 6px 10px}
</style>

function renderSVG(tmpl,a){return tmpl.replace(/@A2/g,'stroke="'+a+'" fill="none" stroke-linecap="round" stroke-linejoin="round"').replace(/@B2/g,'stroke="#d4edda" fill="none" stroke-linecap="round" stroke-linejoin="round"').replace(/@A/g,a);}
function svgFor(exId,accent){var k=SVGKEY[exId]||exId;var t=SVGT[k];if(!t)return '<svg viewBox="0 0 120 120" style="width:100%;height:100%"><circle cx="60" cy="60" r="40" fill="none" stroke="#2d6a4f" stroke-width="1.5"/><text x="60" y="64" font-size="9" fill="#52a36e" text-anchor="middle">Exercise</text></svg>';return renderSVG(t,accent);}

/* ============================ STATE ============================ */
const LS_KEY = "golfProgram.v1";
function load(){
  try{ const r = JSON.parse(localStorage.getItem(LS_KEY)); if(r&&typeof r==="object") return Object.assign(defaultState(),r); }catch(e){}
  return defaultState();
}
function defaultState(){ return { week:1, logs:{}, sessions:[], settings:{vibrate:true,sound:true,hideInstall:false}, started:null }; }
let S = load();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* ===== keys & logs ===== */
function lk(week,day,exId){ return week+"|"+day+"|"+exId; }
function targetText(exId,item,week){
  const ex=EX[exId];
  if(ex&&ex.progression){ const p=ex.progression.find(p=>p.week===week); if(p) return p.detail; }
  return item?item.reps:"";
}
function parseSetCount(str){ const m=String(str).match(/(\d+)\s*[×x]/); return m?Math.max(1,Math.min(8,+m[1])):1; }
function parseRepGuess(str){ const m=String(str).match(/[×x]\s*(\d+)/); return m?m[1]:""; }
function isTimed(reps){ return /\d+\s*-?\s*\d*\s*s(ec)?(\b|\/|$)/i.test(String(reps))||/hold/i.test(String(reps)); }
function parseSeconds(str){ const m=String(str).match(/(\d+)\s*(?:-\s*(\d+))?\s*s/i); if(!m)return 30; return m[2]?+m[2]:+m[1]; }
function parseRest(item,section){
  if(item&&item.note){ const m=item.note.match(/(\d+)\s*s/i); if(m)return +m[1]; }
  if(section&&section.subtitle){ const m=section.subtitle.match(/(\d+)\s*s/); if(m)return +m[1]; }
  return 60;
}
function getLog(week,day,exId,targetStr){
  const k=lk(week,day,exId);
  if(!S.logs[k]){ const n=parseSetCount(targetStr); const sets=[]; for(let i=0;i<n;i++) sets.push({w:"",r:"",done:false}); S.logs[k]={sets:sets}; }
  return S.logs[k];
}
function buildExList(dayIdx){ const seen={},list=[]; PLAN[dayIdx].sections.forEach(s=>s.items.forEach(i=>{ if(!seen[i.exId]){seen[i.exId]=1;list.push(i.exId);} })); return list; }
function exItem(dayIdx,exId){ let found=null; PLAN[dayIdx].sections.forEach(s=>s.items.forEach(i=>{ if(i.exId===exId&&!found) found=i; })); return found; }

/* ===== completion / stats ===== */
function exDone(week,day,exId){ const l=S.logs[lk(week,day,exId)]; return !!(l&&l.sets.some(s=>s.done)); }
function dayDoneCount(week,day){ return buildExList(day).filter(e=>exDone(week,day,e)).length; }
function dayTotal(day){ return buildExList(day).length; }
function dayCompleted(week,day){ return S.sessions.some(s=>s.week===week&&s.day===day); }
function lastCompletedDate(week,day){ const ss=S.sessions.filter(s=>s.week===week&&s.day===day); return ss.length?ss[ss.length-1].date:null; }
function totalSessions(){ return S.sessions.length; }
function weekDaysDone(week){ const set={}; S.sessions.forEach(s=>{ if(s.week===week) set[s.day]=1; }); return Object.keys(set).length; }
function computeStreak(){
  if(!S.sessions.length) return 0;
  const days={}; S.sessions.forEach(s=>{ days[s.date.slice(0,10)]=1; });
  const keys=Object.keys(days).sort();
  let streak=0; let cur=new Date(); cur.setHours(0,0,0,0);
  const todayK=fmtDateKey(cur);
  // allow streak to count if last workout was today or yesterday
  if(!days[todayK]){ cur.setDate(cur.getDate()-1); if(!days[fmtDateKey(cur)]) return 0; }
  while(days[fmtDateKey(cur)]){ streak++; cur.setDate(cur.getDate()-1); }
  return streak;
}
function fmtDateKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function fmtDateLong(iso){ const d=new Date(iso); return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
function setVolume(s){ const w=parseFloat(s.w)||0, r=parseFloat(s.r)||0; return w>0&&r>0?w*r:0; }
function bestVolumeBefore(exId,beforeWeek){
  let best=0;
  for(let w=1;w<beforeWeek;w++){ for(let d=0;d<PLAN.length;d++){ const l=S.logs[lk(w,d,exId)]; if(l) l.sets.forEach(s=>{ const v=setVolume(s); if(v>best)best=v; }); } }
  return best;
}
function lastWeekSummary(exId,day,week){
  for(let w=week-1;w>=1;w--){ const l=S.logs[lk(w,day,exId)]; if(l){ const done=l.sets.filter(s=>s.w||s.r); if(done.length){ return {week:w, txt:done.map(s=>(s.w?s.w+"×":"")+(s.r||"–")).join(", ")}; } } }
  return null;
}

function buzz(ms){ if(S.settings.vibrate&&navigator.vibrate){ try{navigator.vibrate(ms);}catch(e){} } }
let actx=null;
function beep(freq,dur,type){
  if(!S.settings.sound) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended")actx.resume();
    const o=actx.createOscillator(),g=actx.createGain(); o.type=type||"sine"; o.frequency.value=freq||660;
    o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(0.001,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.32,actx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0008,actx.currentTime+(dur||0.18));
    o.start(); o.stop(actx.currentTime+(dur||0.18)); }catch(e){}
}
function chime(){ beep(660,0.14); setTimeout(()=>beep(880,0.18),130); setTimeout(()=>beep(1175,0.26),300); }
let toastTimer=null;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1900); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let holdInt=null, holdRunning=false, holdRemain=0;
function fmtClock(s){ s=Math.max(0,Math.ceil(s)); if(s<60)return s+"s"; const m=Math.floor(s/60),ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

    '<div class="timerctrls"><button onclick="holdAdd(-10)">−10s</button><button class="go" id="holdgo" onclick="holdToggle('+sec+')">'+(holdRunning?"Pause":"Start")+'</button><button onclick="holdReset('+sec+')">Reset</button><button onclick="holdAdd(10)">+10s</button></div>'+
    '<div style="font-size:11px;color:var(--muted);margin-top:9px;text-align:center">Target hold: '+sec+'s · counts down &amp; beeps when done</div></div>';

function holdToggle(sec){
  if(holdRunning){ holdPause(); return; }
  if(holdRemain<=0) holdRemain=sec;
  holdRunning=true; const end=Date.now()+holdRemain*1000;
  const go=document.getElementById("holdgo"); if(go)go.textContent="Pause"; buzz(12);
  holdInt=setInterval(()=>{
    const rem=(end-Date.now())/1000, num=document.getElementById("holdnum");
    if(rem<=0){ holdRunning=false; clearInterval(holdInt); holdInt=null; holdRemain=0;
      if(num){num.textContent="Done ✓"; num.className="timedisplay go";}
      chime(); buzz([0,200,90,200]); logHold(sec);
      const g=document.getElementById("holdgo"); if(g)g.textContent="Start"; return; }
    holdRemain=rem; if(num){ num.textContent=fmtClock(rem); num.className="timedisplay"+(rem<=5?" warn":""); }
  },200);
}
function holdPause(){ holdRunning=false; if(holdInt){clearInterval(holdInt);holdInt=null;} const go=document.getElementById("holdgo"); if(go)go.textContent="Start"; }
function holdReset(sec){ holdPause(); holdRemain=sec; const num=document.getElementById("holdnum"); if(num){num.textContent=fmtClock(sec); num.className="timedisplay";} }
function holdAdd(s){ holdPause(); holdRemain=Math.max(0,Math.round(holdRemain)+s); const num=document.getElementById("holdnum"); if(num)num.textContent=fmtClock(holdRemain); }
function logHold(sec){
  const tgt=targetText(V.exId,exItem(V.day,V.exId),S.week), l=getLog(S.week,V.day,V.exId,tgt);
  let idx=l.sets.findIndex(s=>!s.done); if(idx<0){ l.sets.push({w:"",r:"",done:false}); idx=l.sets.length-1; }
  l.sets[idx].r=sec+"s"; save(); renderLogger(); toggleSet(idx); toast("Hold logged to set "+(idx+1));
}

/* ===== Rest timer (floating) ===== */
let restInt=null;
function startRest(sec,accent){
  stopRest(true);
  let el=document.getElementById("resttimer");
  if(!el){ el=document.createElement("div"); el.id="resttimer"; document.body.appendChild(el); }
  el.innerHTML='<div class="rt-num" id="rt-num" style="color:'+(accent||"#52a36e")+'">'+sec+'</div>'+
    '<div class="rt-mid"><div class="rt-lbl">Rest</div><div class="rt-bar"><div class="rt-fill" id="rt-fill" style="background:'+(accent||"#52a36e")+'"></div></div></div>'+
    '<div class="rt-btns"><button onclick="restAdd(-15)">−15</button><button onclick="restAdd(15)">+15</button><button onclick="stopRest(false)">Skip</button></div>';
  el.dataset.end=Date.now()+sec*1000; el.dataset.total=sec; buzz(12);
  restInt=setInterval(()=>{
    const e=+el.dataset.end, tot=+el.dataset.total, rem=(e-Date.now())/1000;
    const num=document.getElementById("rt-num"), fill=document.getElementById("rt-fill");
    if(rem<=0){ stopRest(false,true); return; }
    if(num)num.textContent=Math.ceil(rem);
    if(fill)fill.style.width=Math.min(100,rem/tot*100)+"%";
  },200);
}
function restAdd(s){ const el=document.getElementById("resttimer"); if(!el)return; el.dataset.end=+el.dataset.end+s*1000; const rem=(+el.dataset.end-Date.now())/1000; if(rem>+el.dataset.total) el.dataset.total=rem; buzz(8); }
function stopRest(silent,finished){ if(restInt){clearInterval(restInt);restInt=null;} const el=document.getElementById("resttimer"); if(el)el.remove(); if(finished){ chime(); buzz([0,180,90,180]); toast("Rest over — go! 💪"); } }

/* ============================ GUIDED WORKOUT ============================ */
function startGuided(day){
  V.day=day; V.exList=buildExList(day);
  const steps=[]; PLAN[day].sections.forEach(sec=>sec.items.forEach(it=>steps.push({sec:sec,item:it})));
  V.gSteps=steps; V.gStep=0; V.screen="guided"; window.scrollTo(0,0); render();
}
function renderGuided(){
  const day=PLAN[V.day], accent=day.accent, total=V.gSteps.length;
  if(V.gStep>=total) return finishGuided();
  const step=V.gSteps[V.gStep], item=step.item;
  V.exId=item.exId; V.counter=0; V.tool=null; holdRemain=0;
  const ex=EX[item.exId], tgt=targetText(item.exId,item,S.week), pct=V.gStep/total;
  app().innerHTML=
    '<div class="guided-top"><button class="backbtn" onclick="exitGuided()">✕ Exit</button>'+
      '<div style="flex:1"><div class="progresswrap" style="margin:0"><div class="progressbar" style="background:'+accent+';width:'+(pct*100)+'%"></div></div></div>'+
      '<div class="gcount">'+(V.gStep+1)+' / '+total+'</div></div>'+
    '<div class="gsec" style="color:'+accent+'">'+esc(step.sec.title)+(item.note?' · '+esc(item.note):"")+'</div>'+
    '<div class="gname">'+esc(ex.name)+'</div>'+
    '<div class="gtarget">'+esc(tgt)+'</div>'+
    '<div class="gillus" onclick="openExercise(\''+item.exId+'\','+V.day+')"><div class="frame">'+svgFor(item.exId,accent)+'</div></div>'+
    '<div style="text-align:center;font-size:12px;color:var(--txt2);margin:0 18px 10px;font-style:italic;font-family:var(--serif)">'+esc(ex.cue)+'</div>'+
    '<div style="text-align:center;margin-bottom:6px"><span style="font-size:11px;color:'+accent+'" onclick="openExercise(\''+item.exId+'\','+V.day+')">⛳ full details, video &amp; how-to ›</span></div>'+
    '<div style="padding:0 16px"><div id="loggerWrap"></div><div id="toolsWrap"></div></div>'+
    '<div style="height:100px"></div>'+
    '<div class="gnav">'+
      '<button onclick="gPrev()"'+(V.gStep===0?' disabled':"")+'>‹</button>'+
      (V.gStep<total-1?'<button class="primary" onclick="gNext()">Next ›</button>':'<button class="finish" onclick="finishGuided()">Finish Workout 🏁</button>')+
    '</div>';
  renderLogger(); renderTools();
}
function gNext(){ stopRest(true); if(V.gStep<V.gSteps.length-1){ V.gStep++; window.scrollTo(0,0); renderGuided(); } else finishGuided(); }
function gPrev(){ stopRest(true); if(V.gStep>0){ V.gStep--; window.scrollTo(0,0); renderGuided(); } }
function exitGuided(){ stopRest(true); V.screen="day"; render(); }
function finishGuided(){
  stopRest(true); holdPause();
  const w=S.week;
  buildExList(V.day).forEach(e=>{ const item=exItem(V.day,e), tgt=targetText(e,item,w), l=getLog(w,V.day,e,tgt); if(!l.sets.some(s=>s.done)) l.sets.forEach(s=>s.done=true); });
  if(!dayCompleted(w,V.day)) S.sessions.push({week:w,day:V.day,date:new Date().toISOString()});
  save(); showCelebrate(V.day);
}

/* ============================ CELEBRATE + CONFETTI ============================ */
function showCelebrate(day){
  const streak=computeStreak(), wd=weekDaysDone(S.week);
  const el=document.createElement("div"); el.id="celebrate";
  const msg = wd>=3 ? "That's all 3 days this week — week "+S.week+" in the books!" : "Logged and saved on this device. Keep stacking days.";
  el.innerHTML='<div class="big">🏌️</div><h2>'+esc(PLAN[day].label)+' Complete!</h2><p>'+esc(msg)+'</p>'+
    '<div class="cstats"><div class="cstat"><div class="v">'+streak+'</div><div class="l">🔥 Day streak</div></div>'+
    '<div class="cstat"><div class="v">'+wd+'/3</div><div class="l">Week '+S.week+'</div></div>'+
    '<div class="cstat"><div class="v">'+totalSessions()+'</div><div class="l">Total</div></div></div>'+
    '<button onclick="closeCelebrate()">Let’s go 💪</button>';
  document.body.appendChild(el); fireConfetti(); chime(); buzz([0,120,60,120,60,220]);
}
function closeCelebrate(){ const el=document.getElementById("celebrate"); if(el)el.remove(); V.screen="home"; V.tab="train"; window.scrollTo(0,0); render(); }
function fireConfetti(){
  const cv=document.getElementById("confetti"); cv.classList.remove("hidden");
  const ctx=cv.getContext("2d"); cv.width=window.innerWidth; cv.height=window.innerHeight;
  const colors=["#52a36e","#d4a336","#5a9fd4","#d4905a","#d4edda"]; const parts=[];
  for(let i=0;i<150;i++) parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*0.5,r:4+Math.random()*6,c:colors[i%colors.length],vx:(Math.random()-0.5)*3.4,vy:2+Math.random()*4.5,rot:Math.random()*6,vr:(Math.random()-0.5)*0.32});
  let frames=0;
  (function tick(){ frames++; ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.rot+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); ctx.restore(); });
    if(frames<170) requestAnimationFrame(tick); else cv.classList.add("hidden");
  })();
}

/* ============================ HISTORY ============================ */
function renderHistory(){
  const ss=S.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date));
  let grid='<div style="display:flex;gap:6px;margin-bottom:16px">';
  for(let wk=1;wk<=5;wk++){ const dn=weekDaysDone(wk); grid+='<div style="flex:1;text-align:center;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:9px;padding:9px 2px"><div style="font-size:17px;font-weight:800;color:'+(dn>=3?"#52a36e":"#d4edda")+';font-family:Georgia">'+dn+'<span style="font-size:11px;color:var(--muted)">/3</span></div><div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px">Wk '+wk+'</div></div>'; }
  grid+='</div>';
  let body;
  if(!ss.length) body='<div class="empty">No workouts logged yet.<br>Finish a day and it shows up here —<br>track your progress week after week.</div>';
  else body=ss.map(s=>{ const day=PLAN[s.day], dc=buildExList(s.day).filter(e=>exDone(s.week,s.day,e)).length;
    return '<button class="histcard" onclick="openDayWeek('+s.week+','+s.day+')" style="border-left:3px solid '+day.accent+'"><div class="ht"><div class="hname">'+esc(day.label)+'</div><div class="hdate">'+esc(fmtDateLong(s.date))+'</div></div><div class="hmeta">Week '+s.week+' · '+esc(day.day)+' · '+dc+' exercises logged</div></button>'; }).join("");
  app().innerHTML='<div class="hero"><div class="kicker">Your Progress</div><h1>Workout History</h1><div class="sub">'+totalSessions()+' sessions · 🔥 '+computeStreak()+' day streak</div></div><div class="pad">'+grid+body+'</div>'+tabbar();
}
function openDayWeek(w,d){ S.week=w; save(); openDay(d); }

/* ============================ SETTINGS ============================ */
function renderSettings(){
  const tog=(label,sub,val,fn)=>'<button class="setbtn" onclick="'+fn+'"><div>'+label+'<div class="sv">'+sub+'</div></div><div class="toggle'+(val?" on":"")+'"><div class="knob"></div></div></button>';
  app().innerHTML='<div class="hero"><div class="kicker">Preferences</div><h1>Settings</h1><div class="sub">Everything is stored only on this device</div></div><div class="pad">'+
    tog("Vibration / haptics","Buzz on taps, sets &amp; timers",S.settings.vibrate,"toggleSetting('vibrate')")+
    tog("Sound cues","Beeps for reps &amp; rest timer",S.settings.sound,"toggleSetting('sound')")+
    '<button class="setbtn" onclick="exportData()"><div>Export / back up data<div class="sv">Download a JSON file of all your logs</div></div><div class="sv">⬇</div></button>'+
    '<label class="setbtn" style="cursor:pointer"><div>Import data<div class="sv">Restore from a backup file</div></div><input type="file" accept="application/json" style="display:none" onchange="importData(this)"><div class="sv">⬆</div></label>'+
    '<button class="setbtn" onclick="resetWeekData()"><div>Reset current week (Wk '+S.week+')<div class="sv">Clears logs &amp; completion for this week only</div></div><div class="sv">↺</div></button>'+
    '<button class="setbtn" style="border-color:#5a2020" onclick="resetAll()"><div style="color:#ff9a9a">Erase everything<div class="sv" style="color:#c98">Delete all logs, history &amp; settings</div></div><div class="sv">🗑</div></button>'+
    '<div style="font-size:11px;color:var(--muted2);text-align:center;margin-top:20px;line-height:1.7">Golf Strength Program · 5-Week Plan · 3 Days/Week<br>Program by David Sundberg, PGA Tour Trainer<br>Add to Home Screen to use fully offline.</div>'+
    '</div>'+tabbar();
}
function toggleSetting(k){ S.settings[k]=!S.settings[k]; save(); if(k==="sound"&&S.settings.sound) beep(680,0.1); if(k==="vibrate"&&S.settings.vibrate) buzz(20); renderSettings(); }
function exportData(){ try{ const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="golf-program-backup-"+fmtDateKey(new Date())+".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); toast("Backup downloaded"); }catch(e){ toast("Export failed"); } }
function importData(input){ const f=input.files&&input.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); S=Object.assign(defaultState(),d); save(); toast("Data imported ✓"); go("home","train"); }catch(e){ toast("Invalid backup file"); } }; r.readAsText(f); }
function resetWeekData(){ if(!confirm("Clear all logs & completion for Week "+S.week+"?"))return; const w=S.week; Object.keys(S.logs).forEach(k=>{ if(k.indexOf(w+"|")===0) delete S.logs[k]; }); S.sessions=S.sessions.filter(s=>s.week!==w); save(); toast("Week "+w+" reset"); renderSettings(); }
function resetAll(){ if(!confirm("Erase ALL data? This cannot be undone."))return; S=defaultState(); save(); toast("All data erased"); go("home","train"); }

/* ============================ INIT ============================ */
window.addEventListener("resize",()=>{ const cv=document.getElementById("confetti"); if(cv&&!cv.classList.contains("hidden")){ cv.width=window.innerWidth; cv.height=window.innerHeight; } });
render();
</script>
